[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network-scanner"
version = "0.1.0"
description = "A small educational IPv4 host discovery CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
network-scanner = "network_scanner.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/network_scanner"]
